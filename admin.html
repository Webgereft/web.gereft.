<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت وب گرفت</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        .admin-container { max-width: 900px; margin: 120px auto; padding: 30px; background: #fff; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-family: inherit; font-size: 16px; color: #64748b; cursor: pointer; padding: 10px 20px; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background: #fff7ed; color: #d97706; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .news-item { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .news-item h4 { color: #0f172a; margin-bottom: 5px; }
        .review-item { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .review-item.approved { border-right: 4px solid #22c55e; }
        .review-item.pending { border-right: 4px solid #eab308; }
        .btn-sm { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-family: inherit; color: white; font-size: 13px; }
        .btn-approve { background: #22c55e; }
        .btn-delete { background: #ef4444; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div id="login-section">
            <h2 class="section-title">ورود به <span>پنل مدیریت</span></h2>
            <form id="login-form" class="order-form">
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="email" required placeholder="ایمیل ادمین">
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <button type="submit" class="btn-primary btn-large" style="width: 100%;">ورود</button>
            </form>
            <p id="login-error" style="color: red; text-align: center; margin-top: 15px;"></p>
        </div>

        <div id="dashboard-section" class="hidden">
            <div class="admin-header">
                <h2 class="section-title" style="margin-bottom: 0;">پنل <span>مدیریت</span></h2>
                <button id="logout-btn" class="btn-secondary" style="padding: 8px 15px;">خروج</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('news')">مدیریت اخبار</button>
                <button class="tab-btn" onclick="switchTab('reviews')">مدیریت نظرات (تایید)</button>
            </div>

            <!-- تب اخبار -->
            <div id="news-tab" class="tab-content active">
                <form id="news-form" class="order-form" style="margin-bottom: 30px;">
                    <div class="form-group">
                        <label>عنوان خبر</label>
                        <input type="text" id="news-title" required placeholder="عنوان خبر...">
                    </div>
                    <div class="form-group">
                        <label>متن خبر</label>
                        <textarea id="news-content" rows="3" required placeholder="متن کامل خبر..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">افزودن خبر</button>
                </form>
                <div id="news-list"></div>
            </div>

            <!-- تب نظرات -->
            <div id="reviews-tab" class="tab-content">
                <div id="reviews-list"></div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://fvkzvfumabhhqzozxwlb.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2a3p2ZnVtYWJoaHF6b3p4d2xiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDAzNzAsImV4cCI6MjEwODA3NjM3MH0.R4qUmFcN_c1U3wtYJoIPlg-BEt5yoeEl2Uo1cW62MNM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // مدیریت تب‌ها
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
            if(tabName === 'news') loadNews();
            if(tabName === 'reviews') loadReviews();
        }

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadNews();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        }

        // لاگین
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('login-error').innerText = "ایمیل یا رمز عبور اشتباه است!";
            } else {
                document.getElementById('login-error').innerText = "";
                checkSession();
            }
        });

        // خروج
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            checkSession();
        });

        // افزودن خبر
        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('news-title').value;
            const content = document.getElementById('news-content').value;
            const { error } = await supabase.from('news').insert([{ title: title, content: content }]);
            if (error) alert("خطا: " + error.message);
            else { alert("خبر ثبت شد!"); document.getElementById('news-form').reset(); loadNews(); }
        });

        // لود اخبار
        async function loadNews() {
            const newsList = document.getElementById('news-list');
            const { data } = await supabase.from('news').select('*').order('created_at', { ascending: false });
            if (data) {
                newsList.innerHTML = '';
                data.forEach(item => {
                    newsList.innerHTML += `
                        <div class="news-item">
                            <div><h4>${item.title}</h4><p style="color: #64748b; font-size: 13px;">${item.content}</p></div>
                            <button class="btn-sm btn-delete" onclick="deleteNews(${item.id})">حذف</button>
                        </div>`;
                });
            }
        }

        // حذف خبر
        async function deleteNews(id) {
            if(confirm('حذف شود؟')) { await supabase.from('news').delete().eq('id', id); loadNews(); }
        }

        // لود نظرات
        async function loadReviews() {
            const reviewsList = document.getElementById('reviews-list');
            const { data } = await supabase.from('reviews').select('*').order('created_at', { ascending: false });
            if (data) {
                reviewsList.innerHTML = '';
                data.forEach(item => {
                    const statusClass = item.is_approved ? 'approved' : 'pending';
                    const statusText = item.is_approved ? 'تایید شده' : 'در انتظار تایید';
                    const btnHtml = item.is_approved 
                        ? `<button class="btn-sm btn-delete" onclick="deleteReview(${item.id})">حذف</button>`
                        : `<button class="btn-sm btn-approve" onclick="approveReview(${item.id})">تایید</button> <button class="btn-sm btn-delete" onclick="deleteReview(${item.id})">حذف</button>`;

                    reviewsList.innerHTML += `
                        <div class="review-item ${statusClass}">
                            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                                <strong>${item.name}</strong>
                                <span style="font-size:12px; background:#e2e8f0; padding:2px 8px; border-radius:10px;">${statusText}</span>
                            </div>
                            <p style="color: #f59e0b; margin-bottom: 10px;">${'⭐'.repeat(item.rating)}</p>
                            <p style="margin-bottom: 15px;">${item.message}</p>
                            <div>${btnHtml}</div>
                        </div>`;
                });
            }
        }

        // تایید نظر
        async function approveReview(id) {
            await supabase.from('reviews').update({ is_approved: true }).eq('id', id);
            loadReviews();
        }

        // حذف نظر
        async function deleteReview(id) {
            if(confirm('حذف شود؟')) { await supabase.from('reviews').delete().eq('id', id); loadReviews(); }
        }

        checkSession();
        supabase.auth.onAuthStateChange(() => { checkSession(); });
    </script>
</body>
</html>
