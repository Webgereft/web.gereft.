<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت وب گرفت</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        .admin-container { max-width: 800px; margin: 120px auto; padding: 40px; }
        .hidden { display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .news-list { margin-top: 40px; }
        .news-item { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .news-item h4 { color: #d4af37; margin-bottom: 5px; }
        .news-item .actions button { background: none; border: none; color: #fff; cursor: pointer; margin-left: 10px; font-size: 16px; transition: 0.3s; }
        .news-item .actions button:hover { color: #d4af37; }
    </style>
</head>
<body>
    <div class="admin-container glass-card">
        <div id="login-section">
            <h2 class="section-title">ورود به <span>پنل مدیریت</span></h2>
            <form id="login-form" class="order-form">
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="email" required placeholder="ایمیل ادمین">
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <button type="submit" class="btn-primary btn-large" style="width: 100%;">ورود</button>
            </form>
            <p id="login-error" style="color: red; text-align: center; margin-top: 15px;"></p>
        </div>

        <div id="dashboard-section" class="hidden">
            <div class="admin-header">
                <h2 class="section-title" style="margin-bottom: 0;">مدیریت <span>اخبار</span></h2>
                <button id="logout-btn" class="btn-secondary">خروج</button>
            </div>
            <form id="news-form" class="order-form" style="max-width: 100%;">
                <div class="form-group">
                    <label>عنوان خبر</label>
                    <input type="text" id="news-title" required placeholder="عنوان خبر...">
                </div>
                <div class="form-group">
                    <label>متن خبر</label>
                    <textarea id="news-content" rows="4" required placeholder="متن کامل خبر..."></textarea>
                </div>
                <button type="submit" class="btn-primary btn-large" style="width: 100%;">افزودن خبر</button>
            </form>
            <div id="news-list" class="news-list"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://fvkzvfumabhhqzozxwlb.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2a3p2ZnVtYWJoaHF6b3p4d2xiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDAzNzAsImV4cCI6MjEwODA3NjM3MH0.R4qUmFcN_c1U3wtYJoIPlg-BEt5yoeEl2Uo1cW62MNM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadNews();
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('login-error').innerText = "ایمیل یا رمز عبور اشتباه است!";
            } else {
                document.getElementById('login-error').innerText = "";
                checkSession();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            checkSession();
        });

        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('news-title').value;
            const content = document.getElementById('news-content').value;
            const { error } = await supabase.from('news').insert([{ title: title, content: content }]);
            if (error) {
                alert("خطا در ذخیره خبر: " + error.message);
            } else {
                alert("خبر با موفقیت ثبت شد!");
                document.getElementById('news-form').reset();
                loadNews();
            }
        });

        async function loadNews() {
            const newsList = document.getElementById('news-list');
            const { data, error } = await supabase.from('news').select('*').order('created_at', { ascending: false });
            if (data) {
                newsList.innerHTML = '';
                data.forEach(item => {
                    const date = new Date(item.created_at).toLocaleDateString('fa-IR');
                    newsList.innerHTML += `
                        <div class="news-item">
                            <div>
                                <h4>${item.title}</h4>
                                <p style="color: #888; font-size: 14px;">${date}</p>
                            </div>
                            <div class="actions">
                                <button onclick="deleteNews(${item.id})" title="حذف"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        async function deleteNews(id) {
            if(confirm('آیا مطمئنی میخوای این خبر رو حذف کنی؟')) {
                await supabase.from('news').delete().eq('id', id);
                loadNews();
            }
        }
        checkSession();
        supabase.auth.onAuthStateChange((event, session) => { checkSession(); });
    </script>
</body>
</html>
